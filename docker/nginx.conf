server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Look the API up as it is needed. A fixed address would break every time it restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:3001;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # A little above the API's own 5 MB limit, so it answers with a proper message.
  client_max_body_size 6m;

  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Solving a large timetable, or asking the model, can take minutes.
    proxy_read_timeout 300s;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location = /health {
    proxy_pass http://$api_upstream;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # File names contain a content hash, so they can be cached for good.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri =404;
  }

  # App screens such as /home and /timetable are all served by the single page.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri /index.html;
  }
}
